name: Feature request
description: Propose a focused improvement to the wallet kit
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not include private keys, seed phrases, or wallet credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include provider capabilities and expected API behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable behavior and relevant provider edge cases.
    validations:
      required: true
