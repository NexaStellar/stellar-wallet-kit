name: Bug report
description: Report incorrect wallet-kit behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Never include private keys, seed phrases, credentials, or real user data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide deterministic steps or a test using a mocked provider.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js and package versions
    validations:
      required: true
